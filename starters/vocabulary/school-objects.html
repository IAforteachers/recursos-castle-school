<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School objects · English</title>
<style>
:root{--blue:#2463a6;--pale:#eef6ff;--ink:#203047;--green:#2f855a}
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{background:white;padding:22px 16px 16px;text-align:center;border-bottom:3px solid #dce9f8}
h1{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.2rem);color:var(--blue)}
header p{margin:0;font-size:1rem}
main{max-width:1100px;margin:auto;padding:18px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:4px 0 18px}
button,.mode{font:inherit;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;font-weight:700}
button:focus-visible,.mode:focus-visible{outline:3px solid #f0b429;outline-offset:3px}
.primary{background:var(--blue);color:white}
.secondary{background:#e2ebf6;color:#203047}
.mode[aria-pressed="true"]{background:#164e8b;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}
.card{background:white;border:2px solid #e0e8f2;border-radius:18px;padding:12px;text-align:center;box-shadow:0 3px 9px #1d355710}
.card img{width:100%;max-width:220px;height:130px;object-fit:contain;display:block;margin:auto}
.word{font-size:1.35rem;font-weight:800;margin:7px 0 10px;color:#163e70}
.audio{background:#e7f4ea;color:#185a36;width:100%;font-size:1rem}
.audio:hover{background:#d5eddb}
.note{text-align:center;margin:10px 0 18px;color:#4d6075}
.hidden{display:none!important}
#game{background:white;border-radius:18px;padding:18px;max-width:760px;margin:0 auto}
.gameword{font-size:clamp(1.6rem,5vw,2.5rem);font-weight:800;text-align:center;margin:8px}
.gameimage{display:block;width:220px;height:170px;object-fit:contain;margin:8px auto}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{background:var(--pale);color:#17406b;border:2px solid #c8dcf2;min-height:66px}
.choice img{width:80px;height:65px;object-fit:contain;display:block;margin:auto}
.choice.correct{background:#d8f3e2;border-color:#2f855a}
.choice.wrong{background:#ffe2e2;border-color:#c53030}
#feedback{text-align:center;min-height:28px;font-weight:700;margin:12px}
@media(max-width:450px){main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:8px}.card img{height:105px}.word{font-size:1.15rem}.choices{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
<h1>🎒 School objects</h1>
<p>Look, listen and learn · Mira, escucha y aprende</p>
</header>

<button class="mode" id="gameMode" aria-pressed="false" onclick="showMode('game')">🎯 Juego de escuchar</button>
<button class="secondary" onclick="speakAll()">🔊 Escuchar todas</button>
</div>
<p class="note" id="modeNote">Toca el altavoz para escuchar cada palabra en inglés.</p>

let current=null, score=0, asked=0, answered=false;
function speak(text){
  if(!('speechSynthesis' in window)){alert('Este navegador no permite audio automático. Prueba con Chrome o Safari actualizado.');return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.78; u.pitch=1.05;
  const voices=window.speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang==='en-GB')||voices.find(x=>x.lang.startsWith('en'));
  if(v)u.voice=v;
  window.speechSynthesis.speak(u);
}
function speakAll(){let i=0;function next(){if(i>=items.length)return;speak(items[i].word);i++;setTimeout(next,1450)}next()}
function showMode(mode){
 const cards=mode==='cards';
 document.getElementById('cards').classList.toggle('hidden',!cards);
 document.getElementById('game').classList.toggle('hidden',cards);
 document.getElementById('cardsMode').setAttribute('aria-pressed',cards);
 document.getElementById('gameMode').setAttribute('aria-pressed',!cards);
 document.getElementById('modeNote').textContent=cards?'Toca el altavoz para escuchar cada palabra en inglés.':'Primero escucha. Después, elige el dibujo correcto.';
 if(!cards && !current)nextQuestion();
}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function playQuestion(){if(current)speak(current.word)}
function nextQuestion(){
 current=items[Math.floor(Math.random()*items.length)]; answered=false;
 document.getElementById('gameWord').textContent='👂 Listen!';
 document.getElementById('feedback').textContent='';
 const options=shuffled([current,...shuffled(items.filter(x=>x.key!==current.key)).slice(0,3)]);
 const box=document.getElementById('choices');box.innerHTML='';
 options.forEach(item=>{
   const b=document.createElement('button');b.className='choice';b.type='button';
   b.innerHTML='<img src="'+item.img+'" alt="'+item.meaning+'">';
   b.setAttribute('aria-label','Dibujo: '+item.meaning);
   b.onclick=()=>choose(b,item);box.appendChild(b);
 });
 setTimeout(playQuestion,250);
}
function choose(btn,item){
 if(answered)return; answered=true;asked++;
 if(item.key===current.key){score++;btn.classList.add('correct');document.getElementById('feedback').textContent='⭐ Well done!';}
 else {btn.classList.add('wrong');document.getElementById('feedback').textContent='Casi. Escucha otra vez e inténtalo en la siguiente.';speak(current.word);}
 document.getElementById('score').textContent='Aciertos: '+score+' / '+asked;
}
function restartGame(){score=0;asked=0;document.getElementById('score').textContent='Aciertos: 0';nextQuestion()}
</script>
</body></html>
